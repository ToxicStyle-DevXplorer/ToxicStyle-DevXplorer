name: Update README with recent activity

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-commits
  cancel-in-progress: false

jobs:
  update_readme:
    name: Update this repo's README with recent activity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update recent activity block
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "START_SECTION:activity,END_SECTION:activity"
          feed_list: "https://github.com/ToxicStyle-DevXplorer.atom"
          max_post_count: 5
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          commit_message: "chore: update recent activity"
          committer_username: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"
